<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<title>最強！支払い最強管理アプリ</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#222;background:#f6f6f6}
*{box-sizing:border-box}body{margin:0;padding:16px}.app{max-width:720px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
button,input{font:inherit}button{min-height:44px;border:1px solid #ddd;border-radius:12px;background:white;padding:8px 14px}
.primary{background:#222;color:white;border-color:#222}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.tabs button.active{background:#222;color:white}
.card,.row{background:white;border:1px solid #e2e2e2;border-radius:16px;padding:14px;margin-bottom:10px}
.big{font-size:36px;font-weight:800}.muted{color:#777;font-size:13px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.stat{background:#f4f4f4;border-radius:12px;padding:10px}
.form{display:grid;gap:8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;background:white}
.row.done{opacity:.48}.row.done .name{text-decoration:line-through}.line{display:flex;gap:10px;align-items:center}.grow{flex:1;min-width:0}.note{margin-top:8px}.danger{color:#a00}
@media(max-width:420px){body{padding:12px}.two{grid-template-columns:1fr}.big{font-size:32px}}
</style>
</head>
<body>
<script>
/* 公開版：個人データを初期投入しない */
window.PUBLIC_EMPTY_DEFAULTS = true;
try {
  const p = JSON.parse(localStorage.getItem('payments') || 'null');
  const pat = JSON.parse(localStorage.getItem('patterns') || 'null');
  if (window.PUBLIC_EMPTY_DEFAULTS && p === null) localStorage.setItem('payments', '[]');
  if (window.PUBLIC_EMPTY_DEFAULTS && pat === null) localStorage.setItem('patterns', '[]');
} catch(e) {}
</script>

<main class="app" id="app">
<header><button id="prev">‹</button><div style="text-align:center"><div class="muted">最強！支払い最強管理アプリ</div><strong id="month"></strong></div><button id="next">›</button></header>
<div class="tabs"><button id="monthTab" class="active">今月の支払い</button><button id="patternTab">マイパターン</button></div>

<section id="monthView">
<div class="card"><div class="muted">残りの支払い</div><div class="big" id="remaining">¥0</div>
<div class="stats"><div class="stat">支払い総額<br><b id="total">¥0</b></div><div class="stat">支払済<br><b id="paid">¥0</b></div></div></div>
<div class="line" style="margin-bottom:10px"><button id="makeNext" class="primary grow">＋ 次の月を作成</button><button id="hideDone">済を隠す</button></div>
<div id="notice" class="muted"></div><div id="list"></div>
<div class="card form"><b>＋ 支払いを追加</b><input id="newName" placeholder="支払い項目"><div class="two"><input id="newAmount" type="number" min="0" placeholder="金額" inputmode="numeric"><input id="newDate" type="date"></div><input id="newNote" placeholder="備考（任意）"><button id="add" class="primary">追加する</button></div>
</section>

<section id="patternView" hidden>
<div class="card"><b>マイパターン</b><div class="muted" style="margin-top:5px">毎月の基本設定。各月で変更してもパターンは変わりません。<br>支払月は「当月」または「翌月」、日付は1〜31日で設定できます。</div></div>
<div id="patterns"></div><button id="addPattern" class="primary" style="width:100%">＋ パターンを追加</button>
</section>
</main>
<script>
const STORE="sena-payment-manager-v3";
let state=JSON.parse(localStorage.getItem(STORE)||"null")||{view:new Date().toISOString().slice(0,7),months:{},patterns:[]};
let hideDone=false;
const $=id=>document.getElementById(id);
const yen=n=>new Intl.NumberFormat("ja-JP",{style:"currency",currency:"JPY",maximumFractionDigits:0}).format(n);
const save=()=>localStorage.setItem(STORE,JSON.stringify(state));
const monthLabel=k=>{let [y,m]=k.split("-");return `${y}年${Number(m)}月`};
function keyShift(k,n){let [y,m]=k.split("-").map(Number),d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
 $("month").textContent=monthLabel(state.view);
 let arr=state.months[state.view]||[]; arr.sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
 let total=0,paid=0; arr.forEach(x=>{total+=Number(x.amount)||0;if(x.done)paid+=Number(x.amount)||0});
 $("total").textContent=yen(total);$("paid").textContent=yen(paid);$("remaining").textContent=yen(total-paid);
 const list=$("list");list.innerHTML="";
 arr.forEach(x=>{
   if(hideDone&&x.done)return;
   let d=document.createElement("div");d.className="row"+(x.done?" done":"");
   d.innerHTML=`<div class="line"><input class="check" type="checkbox" ${x.done?"checked":""} style="width:22px;height:22px"><input class="name grow" value="${esc(x.name)}"><button class="del danger">削除</button></div>
   <div class="two" style="margin-top:8px"><input class="amount" type="number" min="0" value="${x.amount}"><input class="date" type="date" value="${x.date}"></div>
   <input class="note" placeholder="備考（任意）" value="${esc(x.note||"")}">`;
   d.querySelector(".check").onchange=e=>{x.done=e.target.checked;save();render()};
   d.querySelector(".name").onchange=e=>{x.name=e.target.value.trim()||"未入力";save();render()};
   d.querySelector(".amount").onchange=e=>{x.amount=Math.max(0,Number(e.target.value)||0);save();render()};
   d.querySelector(".date").onchange=e=>{if(e.target.value){x.date=e.target.value;save();render()}};
   d.querySelector(".note").onchange=e=>{x.note=e.target.value;save()};
   d.querySelector(".del").onclick=()=>{state.months[state.view]=arr.filter(i=>i.id!==x.id);save();render()};
   list.appendChild(d);
 });
}
function renderPatterns(){
 const p=$("patterns");p.innerHTML="";
 state.patterns.forEach((x,i)=>{
  if(!x.pid) x.pid=`p-${Date.now()}-${i}-${Math.random().toString(36).slice(2,8)}`;
  if(x.offset!==1) x.offset=0;
  let d=document.createElement("div");d.className="card";
  d.innerHTML=`<div class="line"><input class="pn grow" value="${esc(x.name)}"><button class="pd danger">削除</button></div>
  <div class="two" style="margin-top:8px"><input class="pa" type="number" min="0" value="${x.amount}"><div class="two"><select class="poff" aria-label="支払月"><option value="0" ${x.offset===0?"selected":""}>当月</option><option value="1" ${x.offset===1?"selected":""}>翌月</option></select><input class="py" type="number" min="1" max="31" value="${x.day}" placeholder="支払日"></div></div>
  <div class="muted" style="margin-top:6px">${x.offset===0?"当月":"翌月"} ${x.day}日に支払い</div>
  <input class="pnote note" value="${esc(x.note||"")}" placeholder="備考（任意）">`;
  d.querySelector(".pn").onchange=e=>{x.name=e.target.value.trim()||"未入力";save();renderPatterns()};
  d.querySelector(".pa").onchange=e=>{x.amount=Math.max(0,Number(e.target.value)||0);save()};
  d.querySelector(".poff").onchange=e=>{x.offset=Number(e.target.value)||0;save();renderPatterns()};
  d.querySelector(".py").onchange=e=>{x.day=Math.min(31,Math.max(1,Number(e.target.value)||1));save();renderPatterns()};
  d.querySelector(".pnote").onchange=e=>{x.note=e.target.value;save()};
  d.querySelector(".pd").onclick=()=>{state.patterns.splice(i,1);save();renderPatterns()};
  p.appendChild(d);
 });
}
$("add").onclick=()=>{
 let name=$("newName").value.trim(),amount=Number($("newAmount").value),date=$("newDate").value;
 if(!name||!date||!Number.isFinite(amount)||amount<0){$("notice").textContent="項目・金額・支払日を入力してください。";return}
 (state.months[state.view]??=[]).push({id:Date.now(),name,amount,date,note:$("newNote").value.trim(),done:false});
 $("newName").value=$("newAmount").value=$("newDate").value=$("newNote").value="";$("notice").textContent="追加しました。";save();render();
};
$("makeNext").onclick=()=>{
 let nk=keyShift(state.view,1);
 let created=0;
 if(!state.months[nk]) state.months[nk]=[];
 const baseMonth=nk;
 state.patterns.forEach((p,i)=>{
   if(!p.pid) p.pid=`p-${Date.now()}-${i}-${Math.random().toString(36).slice(2,8)}`;
   const targetMonth=keyShift(baseMonth,p.offset===1?1:0);
   let [y,m]=targetMonth.split("-").map(Number),last=new Date(y,m,0).getDate();
   const date=`${targetMonth}-${String(Math.min(p.day,last)).padStart(2,"0")}`;
   const exists=Object.values(state.months).some(list=>list.some(x=>x.patternId===p.pid&&x.date===date));
   if(!exists){
     (state.months[targetMonth]??=[]).push({id:Date.now()+i,name:p.name,amount:p.amount,date,note:p.note||"",done:false,patternId:p.pid});
     created++;
   }
 });
 state.view=nk;
 $("notice").textContent=created?`マイパターンから${created}件を追加しました。`:"次の月はすでに作成済みです。追加するパターンはありません。";
 save();render();
};
$("prev").onclick=()=>{state.view=keyShift(state.view,-1);hideDone=false;save();render()};
$("next").onclick=()=>{state.view=keyShift(state.view,1);hideDone=false;save();render()};
$("hideDone").onclick=()=>{hideDone=!hideDone;$("hideDone").textContent=hideDone?"済を表示":"済を隠す";render()};
$("monthTab").onclick=()=>{$("monthView").hidden=false;$("patternView").hidden=true;$("monthTab").classList.add("active");$("patternTab").classList.remove("active")};
$("patternTab").onclick=()=>{$("monthView").hidden=true;$("patternView").hidden=false;$("patternTab").classList.add("active");$("monthTab").classList.remove("active");renderPatterns()};
$("addPattern").onclick=()=>{state.patterns.push({pid:`p-${Date.now()}-${Math.random().toString(36).slice(2,8)}`,name:"新しい支払い",amount:0,day:1,note:""});save();renderPatterns()};
render();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script></body>
</html>
